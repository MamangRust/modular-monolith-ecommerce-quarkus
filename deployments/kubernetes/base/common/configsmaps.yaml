apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce
data:
  APP_ENV: "kubernetes"

  # --- Database ---
  # Every Quarkus module and db-migration default DB_NAME to PAYMENT_GATEWAY
  # (see application.properties); postgres is initialized with POSTGRES_DB below.
  DB_DRIVER: "postgres"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "PAYMENT_GATEWAY"
  POSTGRES_DB: "PAYMENT_GATEWAY"

  # GHCR image owner — must match github.repository_owner (lowercase) of the
  # repository whose CI pushes images to ghcr.io/<owner>/quarkus-ecommerce/...
  GHCR_OWNER: "mamangrust"

  # --- Kafka ---
  KAFKA_BROKERS: "kafka.ecommerce.svc.cluster.local:9092"

  # --- SMTP (email-service + SmtpHealthCheck) ---
  SMTP_SERVER: "smtp.ethereal.email"
  SMTP_PORT: "587"

  # --- OpenTelemetry ---
  # quarkus-opentelemetry reads the standard OTEL_* env vars through the SDK
  # autoconfigure, so no per-module property is required for export.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.ecommerce.svc.cluster.local:4317"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"

  # --- gRPC service discovery ---
  # Keys must match the `${<SVC>_HOST}` / `${<SVC>_GRPC_PORT}` placeholders
  # read from each module's application.properties
  # (quarkus.grpc.clients.<name>.host/port). Ports are the real gRPC server
  # ports from the module source (quarkus.grpc.server.port).
  AUTH_HOST: "auth.ecommerce.svc.cluster.local"
  AUTH_GRPC_PORT: "9012"
  BANNER_HOST: "banner.ecommerce.svc.cluster.local"
  BANNER_GRPC_PORT: "9013"
  CART_HOST: "cart.ecommerce.svc.cluster.local"
  CART_GRPC_PORT: "9003"
  CATEGORY_HOST: "category.ecommerce.svc.cluster.local"
  CATEGORY_GRPC_PORT: "9014"
  MERCHANT_HOST: "merchant.ecommerce.svc.cluster.local"
  MERCHANT_GRPC_PORT: "9005"
  ORDER_HOST: "order.ecommerce.svc.cluster.local"
  ORDER_GRPC_PORT: "9018"
  ORDER_ITEM_HOST: "order-item.ecommerce.svc.cluster.local"
  ORDER_ITEM_GRPC_PORT: "9019"
  PRODUCT_HOST: "product.ecommerce.svc.cluster.local"
  PRODUCT_GRPC_PORT: "9015"
  REVIEW_HOST: "review.ecommerce.svc.cluster.local"
  REVIEW_GRPC_PORT: "9017"
  REVIEW_DETAIL_HOST: "review-detail.ecommerce.svc.cluster.local"
  REVIEW_DETAIL_GRPC_PORT: "9027"
  ROLE_HOST: "role.ecommerce.svc.cluster.local"
  ROLE_GRPC_PORT: "9006"
  SHIPPING_ADDRESS_HOST: "shipping-address.ecommerce.svc.cluster.local"
  SHIPPING_ADDRESS_GRPC_PORT: "9028"
  SLIDER_HOST: "slider.ecommerce.svc.cluster.local"
  SLIDER_GRPC_PORT: "9016"
  TRANSACTION_HOST: "transaction.ecommerce.svc.cluster.local"
  TRANSACTION_GRPC_PORT: "9009"
  USER_HOST: "user.ecommerce.svc.cluster.local"
  USER_GRPC_PORT: "9011"

  # Legacy aliases actually consumed by modules:
  #   - auth reads USER_GRPC_HOST / ROLE_GRPC_HOST
  #   - merchant reads USER_SERVICE_HOST / USER_SERVICE_GRPC_PORT
  USER_GRPC_HOST: "user.ecommerce.svc.cluster.local"
  ROLE_GRPC_HOST: "role.ecommerce.svc.cluster.local"
  USER_SERVICE_HOST: "user.ecommerce.svc.cluster.local"
  USER_SERVICE_GRPC_PORT: "9011"

  # --- Redis (reactive client pool tuning, Phase 7 baseline) ---
  # Host/password are hardcoded in each module's application.properties
  # (redis://:dragon_knight@redis:6379) and provided by the redis base.
  REDIS_MAX_POOL_SIZE: "16"
  REDIS_MAX_POOL_WAITING: "32"
  REDIS_TIMEOUT: "2S"
