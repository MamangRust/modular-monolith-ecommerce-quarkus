# Test-only configuration.
# quarkus-devservices is excluded from quarkus-redis-client in this project, so
# QuarkusTest boots must never trigger Redis DevServices. Tests that need a real
# Redis override this via QuarkusTestResource/TestProfile.
quarkus.redis.devservices.enabled=false
quarkus.redis.hosts=redis://localhost:6379

# Random HTTP/gRPC ports per Quarkus boot so multiple @QuarkusTest classes can
# share one surefire JVM without 'Port already bound' conflicts between
# sequential app starts.
quarkus.http.test-port=0
quarkus.grpc.server.test-port=0
