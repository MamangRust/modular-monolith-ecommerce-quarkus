apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: ecommerce
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

      # Infra scrapes only. Application metrics come in over OTLP
      # (services export via quarkus-opentelemetry -> OTEL_EXPORTER_OTLP_ENDPOINT).
      prometheus:
        config:
          scrape_configs:
            - job_name: "kafka-exporter"
              scrape_interval: 5s
              static_configs:
                - targets: ["kafka-exporter.ecommerce.svc.cluster.local:9308"]

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "jaeger.ecommerce.svc.cluster.local:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "java_app"
        resource_to_telemetry_conversion:
          enabled: true
      otlphttp/loki:
        endpoint: "http://loki.ecommerce.svc.cluster.local:3100/otlp"
        tls:
          insecure: true
        timeout: 10s

    extensions:
      health_check:
      pprof:
      zpages:

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]

        metrics:
          receivers: [otlp, prometheus]
          processors: [batch]
          exporters: [prometheus]

        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/loki]
