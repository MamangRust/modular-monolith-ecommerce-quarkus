apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-detail
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-detail
  template:
    metadata:
      labels:
        app: review-detail
    spec:
      initContainers:
        - name: init-log-permission
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Setting ownership for /var/log/app"
              chown -R 1001:1001 /var/log/app
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
          securityContext:
            runAsUser: 0
      containers:
        - name: review-detail
          image: ghcr.io/__GHCR_OWNER__/quarkus-ecommerce/review_detail:latest
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8099
            - containerPort: 9027
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8099
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8099
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health/live
              port: 8099
            failureThreshold: 30
            periodSeconds: 10
          imagePullPolicy: IfNotPresent

      volumes:
        - name: app-logs
          emptyDir: {}
