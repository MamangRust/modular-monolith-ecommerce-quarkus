services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: PAYMENT_GATEWAY
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=32MB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - log_min_duration_statement=1000
      - -c
      - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
      - -c
      - superuser_reserved_connections=10
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - statement_timeout=30000
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d PAYMENT_GATEWAY"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-node-1:
    image: redis:7.4
    container_name: redis_node_1
    command: >-
      redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight
      --masterauth dragon_knight
    ports:
      - "6379:6379"
    volumes: [redis_node_1_data:/data]

  redis-node-2:
    image: redis:7.4
    container_name: redis_node_2
    command: >-
      redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight
      --masterauth dragon_knight
    ports:
      - "6380:6379"
    volumes: [redis_node_2_data:/data]

  redis-node-3:
    image: redis:7.4
    container_name: redis_node_3
    command: >-
      redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight
      --masterauth dragon_knight
    ports:
      - "6381:6379"
    volumes: [redis_node_3_data:/data]

  redis-node-4:
    image: redis:7.4
    container_name: redis_node_4
    command: >-
      redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight
      --masterauth dragon_knight
    ports:
      - "6382:6379"
    volumes: [redis_node_4_data:/data]

  redis-node-5:
    image: redis:7.4
    container_name: redis_node_5
    command: >-
      redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight
      --masterauth dragon_knight
    ports:
      - "6383:6379"
    volumes: [redis_node_5_data:/data]

  redis-node-6:
    image: redis:7.4
    container_name: redis_node_6
    command: >-
      redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight
      --masterauth dragon_knight
    ports:
      - "6384:6379"
    volumes: [redis_node_6_data:/data]

  redis-cluster-creator:
    image: redis:7.4
    container_name: redis-cluster-creator
    entrypoint: >-
      sh -c "sleep 5 &&
      if redis-cli -h redis-node-1 -p 6379 -a dragon_knight --no-auth-warning cluster info |
      grep -q 'cluster_state:ok'; then
      echo 'Redis cluster already initialized';
      exit 0;
      fi;
      echo yes | redis-cli --cluster create
      redis-node-1:6379 redis-node-2:6379 redis-node-3:6379
      redis-node-4:6379 redis-node-5:6379 redis-node-6:6379
      --cluster-replicas 1 -a dragon_knight"
    depends_on:
      redis-node-1:
        condition: service_started
      redis-node-2:
        condition: service_started
      redis-node-3:
        condition: service_started
      redis-node-4:
        condition: service_started
      redis-node-5:
        condition: service_started
      redis-node-6:
        condition: service_started

  redis-standalone:
    image: redis:7.4
    container_name: redis_standalone
    command: redis-server --port 6399 --requirepass dragon_knight
    ports:
      - "6399:6399"

  kafka:
    image: apache/kafka:latest
    container_name: my-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: kraft-cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_node_1_data:
  redis_node_2_data:
  redis_node_3_data:
  redis_node_4_data:
  redis_node_5_data:
  redis_node_6_data:
