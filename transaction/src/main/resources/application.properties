quarkus.application.name=transaction-service

quarkus.grpc.server.port=9009
quarkus.grpc.server.host=0.0.0.0

# Outbound gRPC clients (transaction orchestrates merchant/order/order_item/shipping/user)
quarkus.grpc.clients.merchant.host=${MERCHANT_HOST:localhost}
quarkus.grpc.clients.merchant.port=${MERCHANT_GRPC_PORT:9005}
quarkus.grpc.clients.order.host=${ORDER_HOST:localhost}
quarkus.grpc.clients.order.port=${ORDER_GRPC_PORT:9018}
quarkus.grpc.clients.order_item.host=${ORDER_ITEM_HOST:localhost}
quarkus.grpc.clients.order_item.port=${ORDER_ITEM_GRPC_PORT:9019}
quarkus.grpc.clients.shipping_address.host=${SHIPPING_ADDRESS_HOST:localhost}
quarkus.grpc.clients.shipping_address.port=${SHIPPING_ADDRESS_GRPC_PORT:9028}
quarkus.grpc.clients.user.host=${USER_HOST:localhost}
quarkus.grpc.clients.user.port=${USER_GRPC_PORT:9011}

quarkus.http.port=8089
quarkus.http.host=0.0.0.0

# Use %prod. prefix so datasource config only applies in production; test/dev profiles
# will fall through to devservices (testcontainers PostgreSQL).
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:DRAGON}
%prod.quarkus.datasource.password=${DB_PASS:DRAGON}
%prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}

quarkus.arc.remove-unused-beans=true
quarkus.grpc.server.use-separate-server=true

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

# Kafka reliability
kafka.bootstrap.servers=${KAFKA_BROKERS:localhost:9092}
kafka.acks=${KAFKA_ACKS:all}
kafka.enable.idempotence=${KAFKA_ENABLE_IDEMPOTENCE:true}
kafka.retries=${KAFKA_RETRIES:10}
kafka.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:500}
kafka.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
kafka.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
kafka.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
# Throughput tuning (Phase 7): compression + batching
kafka.compression.type=${KAFKA_COMPRESSION_TYPE:lz4}
kafka.linger.ms=${KAFKA_LINGER_MS:5}
kafka.batch.size=${KAFKA_BATCH_SIZE:16384}

# Dependency-aware readiness: Kafka producer connectivity
kafka.health.enabled=true
kafka.health.timeout.ms=${KAFKA_HEALTH_TIMEOUT_MS:3000}
transaction.outbox.batch-size=${TRANSACTION_OUTBOX_BATCH_SIZE:50}
transaction.outbox.lease.seconds=${TRANSACTION_OUTBOX_LEASE_SECONDS:300}

# --- Performance tuning baseline (Phase 7) ---
# Conservative starting point; re-tune after load-test measurements.
quarkus.vertx.worker-pool-size=${VERTX_WORKER_POOL_SIZE:20}
quarkus.thread-pool.max-threads=${THREAD_POOL_MAX_THREADS:32}
quarkus.redis.max-pool-size=${REDIS_MAX_POOL_SIZE:16}
quarkus.redis.max-pool-waiting=${REDIS_MAX_POOL_WAITING:32}
quarkus.redis.timeout=${REDIS_TIMEOUT:2S}



# Redis
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://:dragon_knight@localhost:6399}
quarkus.redis.devservices.enabled=${QUARKUS_REDIS_DEV_SERVICES_ENABLED:false}
