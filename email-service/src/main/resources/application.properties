quarkus.application.name=email-service

quarkus.http.port=8092
quarkus.http.host=0.0.0.0

quarkus.arc.remove-unused-beans=true

# Mailer configuration
quarkus.mailer.host=${SMTP_SERVER:localhost}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASS:}
quarkus.mailer.ssl=false
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.from=no-reply@payment-gateway.com

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

# Dependency-aware health checks (Kafka producer connectivity + SMTP)
kafka.health.enabled=true
# SMTP is optional for the local infrastructure-only stack; enable when a
# reachable SMTP server is configured.
smtp.health.enabled=${SMTP_HEALTH_ENABLED:false}
kafka.health.timeout.ms=${KAFKA_HEALTH_TIMEOUT_MS:3000}
smtp.health.timeout.ms=${SMTP_HEALTH_TIMEOUT_MS:3000}

# Kafka reliability
kafka.bootstrap.servers=${KAFKA_BROKERS:localhost:9092}
kafka.email.group.id=${KAFKA_EMAIL_GROUP_ID:email-service-group}
kafka.email.retry.max-attempts=${KAFKA_EMAIL_RETRY_MAX_ATTEMPTS:3}
kafka.email.retry.backoff.ms=${KAFKA_EMAIL_RETRY_BACKOFF_MS:500}
kafka.email.lag.poll.ms=${KAFKA_EMAIL_LAG_POLL_MS:15000}

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

# --- Performance tuning baseline (Phase 7) ---
# Conservative starting point; re-tune after load-test measurements.
quarkus.vertx.worker-pool-size=${VERTX_WORKER_POOL_SIZE:20}
quarkus.thread-pool.max-threads=${THREAD_POOL_MAX_THREADS:32}
quarkus.redis.max-pool-size=${REDIS_MAX_POOL_SIZE:16}
quarkus.redis.max-pool-waiting=${REDIS_MAX_POOL_WAITING:32}
quarkus.redis.timeout=${REDIS_TIMEOUT:2S}


# Redis
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://:dragon_knight@localhost:6399}
quarkus.redis.devservices.enabled=${QUARKUS_REDIS_DEV_SERVICES_ENABLED:false}
