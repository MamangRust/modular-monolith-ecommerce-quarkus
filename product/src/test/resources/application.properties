# Test profile configuration for category module
quarkus.grpc.server.port=9014
quarkus.grpc.server.host=0.0.0.0

quarkus.http.port=8094
quarkus.http.host=0.0.0.0

# Disable actual DB for unit tests
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=test
quarkus.datasource.password=test
quarkus.datasource.reactive.url=postgresql://localhost:5432/test

# Mock Redis
quarkus.redis.hosts=redis://localhost:6379

# Auto-create schema from entity definitions at startup
quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.log.level=WARN
quarkus.log.category."com.sanedge".level=INFO
